[package]
name = "desktop-assistant-shell"
version = "0.1.0"
edition = "2021"
rust-version = "1.77.2"
publish = false

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.5", features = ["tray-icon"] }
tauri-plugin-single-instance = { version = "=2.4.4" }
tauri-plugin-global-shortcut = { version = "=2.3.2" }
tauri-plugin-store = { version = "=2.4.5" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
custom-protocol = ["tauri/custom-protocol"]
